<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familie Hotz-Schoch · Stammbaum</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23D9D6CC'/%3E%3Cpath d='M8 15V4M8 8L3 3M8 8l5-5' stroke='%2324467F' stroke-width='1.4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,500;0,700;1,300&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/family-chart@0.9.0/dist/styles/family-chart.css">
<style>
:root{
  --ink:#182029;
  --paper:#D9D6CC;
  --slip:#F4F3EE;
  --blue:#24467F;
  --rule:#A9A49A;
  --muted:#6E7378;
  --mark:#7A5C2E;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --serif:"Spectral",Iowan Old Style,Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);
  display:grid;grid-template-rows:auto 1fr;
  overflow:hidden;
}

/* ---------- masthead ---------- */
header{
  display:flex;align-items:baseline;gap:1.25rem;flex-wrap:wrap;
  padding:.7rem 1rem .6rem;border-bottom:1px solid var(--ink);
}
h1{
  margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;font-family:var(--mono);
}
.sub{font-size:.8rem;color:var(--muted);font-style:italic}
.depth{
  display:flex;align-items:center;gap:.25rem;font-family:var(--mono);font-size:.66rem;
  color:var(--muted);margin-left:auto;flex-wrap:wrap;
}
.depth .dl{letter-spacing:.08em;text-transform:uppercase;margin-left:.5rem}
.depth .dl:first-child{margin-left:0}
.depth button{
  font-family:var(--mono);font-size:.72rem;line-height:1;width:1.35rem;height:1.35rem;
  background:var(--slip);border:1px solid var(--rule);color:var(--ink);cursor:pointer;padding:0;
}
.depth button:hover{border-color:var(--ink)}
.depth button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.depth button.wide{width:auto;padding:0 .4rem;letter-spacing:.06em}
.depth output{min-width:1rem;text-align:center;color:var(--ink);font-weight:600}
.search{position:relative}
.search input{
  font-family:var(--mono);font-size:.78rem;padding:.35rem .5rem;
  width:min(15rem,42vw);background:var(--slip);color:var(--ink);
  border:1px solid var(--rule);border-radius:0;
}
.search input:focus{outline:2px solid var(--blue);outline-offset:1px}
.results{
  position:absolute;top:100%;right:0;z-index:40;width:min(22rem,80vw);
  max-height:60vh;overflow:auto;background:var(--slip);
  border:1px solid var(--ink);border-top:none;display:none;
}
.results button{
  display:block;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--rule);padding:.4rem .6rem;cursor:pointer;
  font-family:var(--serif);font-size:.86rem;color:var(--ink);
}
.results button:hover,.results button:focus{background:#E7E4DA;outline:none}
.results .g{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-left:.4rem}

/* ---------- three-column body ---------- */
main{display:grid;grid-template-columns:3.1rem 1fr minmax(15rem,21rem);min-height:0}

/* signature: the generation ruler */
.rail{
  border-right:1px solid var(--ink);display:flex;flex-direction:column;
  font-family:var(--mono);font-size:.66rem;overflow:hidden;
}
.rail b{
  writing-mode:vertical-rl;transform:rotate(180deg);
  padding:.5rem 0;letter-spacing:.22em;text-transform:uppercase;
  font-weight:500;color:var(--muted);border-bottom:1px solid var(--rule);
  font-size:.58rem;
}
.rail ol{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column}
.rail li{flex:1;display:flex;min-height:1.1rem}
.rail button{
  flex:1;background:none;border:none;border-bottom:1px solid rgba(169,164,154,.5);
  font-family:var(--mono);font-size:.66rem;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:background .15s,color .15s;
}
.rail button:hover{background:#E7E4DA;color:var(--ink)}
.rail li.on button{background:var(--ink);color:var(--paper);font-weight:600}
.rail li.line button{box-shadow:inset 3px 0 0 var(--blue)}

#chart{min-width:0;position:relative;background:
  linear-gradient(transparent 95%,rgba(169,164,154,.35) 95%) 0 0/100% 2.2rem}
#chart.f3{color:var(--ink)}
.hint{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:var(--mono);font-size:.75rem;color:var(--muted);text-align:center;
  line-height:1.7;pointer-events:none;
}

/* library cards, lightly re-dressed */
.f3 .card-inner,.f3 .card-html,.f3 .card-body-rect{
  border-radius:0;background:var(--slip);border:1px solid var(--ink);
}
.f3 .card-inner.is-line,.f3 .card-html.is-line{box-shadow:inset 4px 0 0 var(--blue)}
.f3 .card-label{font-family:var(--serif)}

/* ---------- the record slip ---------- */
aside{
  border-left:1px solid var(--ink);background:var(--slip);
  overflow-y:auto;padding:0 0 2rem;
}
.callno{
  font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;
  padding:.5rem .9rem;border-bottom:1px solid var(--ink);
  color:var(--muted);text-transform:uppercase;
  display:flex;justify-content:space-between;gap:.5rem;
}
.callno .num{color:var(--ink);font-weight:600}
.slip{padding:.9rem .9rem 0}
.slip img{
  width:100%;max-width:9rem;border:1px solid var(--ink);
  display:block;margin:0 0 .8rem;
}
.slip h2{
  margin:0 0 .1rem;font-size:1.3rem;font-weight:500;line-height:1.15;
}
.slip .nee{font-size:.8rem;color:var(--muted);font-style:italic;margin:0 0 .7rem}
.slip .life{font-family:var(--mono);font-size:.8rem;margin:0 0 .9rem}
.slip .line-badge{
  display:inline-block;font-family:var(--mono);font-size:.6rem;
  letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--blue);
  padding:.15rem .4rem;margin:0 0 .8rem;
}
dl{margin:0 0 .9rem;font-size:.84rem}
dt{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-top:.55rem;
}
dd{margin:.1rem 0 0}
.marginalia{
  border-top:1px solid var(--rule);margin-top:.9rem;padding-top:.6rem;
  font-size:.82rem;line-height:1.45;
}
.marginalia p{margin:0 0 .55rem;padding-left:1rem;position:relative;font-style:italic}
.marginalia p::before{
  content:"§";position:absolute;left:0;top:0;font-style:normal;
  font-family:var(--mono);font-size:.7rem;color:var(--mark);
}
.caveat{
  font-family:var(--mono);font-size:.66rem;color:var(--mark);
  border:1px dashed var(--mark);padding:.3rem .45rem;margin:.2rem 0 0;
}
.kin{border-top:1px solid var(--rule);margin-top:.9rem;padding-top:.6rem}
.kin h3{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin:.5rem 0 .3rem;font-weight:500;
}
.kin button{
  font-family:var(--serif);font-size:.84rem;background:none;cursor:pointer;
  border:none;border-bottom:1px solid var(--rule);color:var(--ink);
  padding:.15rem 0;margin-right:.7rem;
}
.kin button:hover,.kin button:focus{border-bottom-color:var(--blue);color:var(--blue);outline:none}
.empty{padding:1.2rem .9rem;font-size:.86rem;color:var(--muted);font-style:italic}

/* ---------- mobile ---------- */
@media (max-width:820px){
  body{overflow:auto}
  main{grid-template-columns:1fr;grid-template-rows:auto 60vh auto}
  .rail{border-right:none;border-bottom:1px solid var(--ink);flex-direction:row}
  .rail b{writing-mode:horizontal-tb;transform:none;border-bottom:none;
    border-right:1px solid var(--rule);display:flex;align-items:center;padding:0 .5rem}
  .rail ol{flex-direction:row}
  .rail li{min-width:1.9rem}
  .rail button{border-bottom:none;border-right:1px solid rgba(169,164,154,.5)}
  .rail li.line button{box-shadow:inset 0 3px 0 var(--blue)}
  aside{border-left:none;border-top:1px solid var(--ink)}
  header{padding:.55rem .7rem .5rem;gap:.5rem}
  .sub{font-size:.7rem;flex-basis:100%}
  .depth{margin-left:0;font-size:.6rem;gap:.2rem}
  .depth .dl{margin-left:.35rem}
  .search{margin-left:auto}
  .search input{width:min(9rem,38vw)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- password gate --- */
#gate{position:fixed;inset:0;z-index:1000;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:16px}
#gate form{background:var(--slip);border:1px solid var(--rule);padding:28px 24px;width:100%;max-width:340px;display:grid;gap:12px}
#gate h2{margin:0;font-weight:500;font-size:1.5rem}
#gate p{margin:0;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
#gate input{font:inherit;font-size:1rem;padding:10px;border:1px solid var(--rule);background:#fff;color:var(--ink)}
#gate button{font-family:var(--mono);font-size:.9rem;padding:10px;border:0;background:var(--blue);color:#fff;cursor:pointer}
#gate .err{color:#9B2C2C;min-height:1em}
</style>
</head>
<body>
<div id="gate">
  <form id="gate-form" autocomplete="off">
    <h2>Hotz&#8202;–&#8202;Schoch</h2>
    <p>Familienstammbaum · Passwort erforderlich</p>
    <label class="visually-hidden" for="pw" hidden>Passwort</label>
    <input id="pw" type="password" placeholder="Passwort" autofocus>
    <button type="submit">Öffnen</button>
    <p class="err" id="gate-err" aria-live="polite"></p>
  </form>
</div>

<header>
  <h1>Hotz&#8202;–&#8202;Schoch</h1>
  <span class="sub">Vierzehn Generationen · ca. 1580–2024 · Wipkingen bis Winterthur</span>
  <div class="depth" role="group" aria-label="Sichttiefe">
    <span class="dl">Vorfahren</span>
    <button type="button" data-d="anc" data-s="-1" aria-label="Vorfahren weniger">–</button>
    <output id="anc">4</output>
    <button type="button" data-d="anc" data-s="1" aria-label="Vorfahren mehr">+</button>
    <span class="dl">Nachkommen</span>
    <button type="button" data-d="prog" data-s="-1" aria-label="Nachkommen weniger">–</button>
    <output id="prog">4</output>
    <button type="button" data-d="prog" data-s="1" aria-label="Nachkommen mehr">+</button>
    <button type="button" id="all" class="wide">Alle 14</button>
  </div>
  <div class="search">
    <label class="visually-hidden" for="q" hidden>Person suchen</label>
    <input id="q" type="search" placeholder="Person suchen…" autocomplete="off" spellcheck="false">
    <div class="results" id="results" role="listbox"></div>
  </div>
</header>

<main>
  <nav class="rail" aria-label="Generationen">
    <b>Generation</b>
    <ol id="rail"></ol>
  </nav>

  <div id="chart" class="f3">
    <p class="hint" id="hint">Stammbaum wird geladen…</p>
  </div>

  <aside aria-live="polite">
    <div class="callno"><span id="callno-left">Karteikarte</span><span class="num" id="callno-right">—</span></div>
    <div id="slip"><p class="empty">Eine Karte im Baum antippen, um den Eintrag zu lesen.</p></div>
  </aside>
</main>

<script>
function startTree(DATA) {
  "use strict";
  var BY_ID = {};
  DATA.forEach(function (p) { BY_ID[p.id] = p; });

  var GENS = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV"];
  var START = BY_ID["florian_hotz_1984"] ? "florian_hotz_1984" : DATA[0].id;
  var current = START;
  var chart = null, card = null;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var depth = { anc: 4, prog: 4 };
  var MAXD = 14;

  function birthYear(d) {
    var p = d && d.data && BY_ID[d.data.id];
    var s = p ? (p.data.birth || p.data.baptism || p.data.death || "") : "";
    var m = String(s).match(/(\d{4})/);
    return m ? +m[1] : 9999;
  }

  function applyDepth() {
    if (!chart) return;
    try {
      if (typeof chart.setAncestryDepth === "function") chart.setAncestryDepth(depth.anc);
      if (typeof chart.setProgenyDepth === "function") chart.setProgenyDepth(depth.prog);
      chart.updateTree({});
    } catch (e) { console.warn("Tiefe nicht angewandt:", e.message); }
    document.getElementById("anc").textContent = depth.anc >= MAXD ? "alle" : depth.anc;
    document.getElementById("prog").textContent = depth.prog >= MAXD ? "alle" : depth.prog;
  }

  document.querySelectorAll(".depth button[data-d]").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.dataset.d, s = +b.dataset.s;
      depth[k] = Math.max(1, Math.min(MAXD, depth[k] + s));
      applyDepth();
    });
  });
  document.getElementById("all").addEventListener("click", function () {
    depth.anc = depth.prog = MAXD;
    applyDepth();
  });

  function fullName(p) {
    var d = p.data;
    return (d["first name"] || "") + (d["last name"] ? " " + d["last name"] : "");
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ---------- generation ruler ---------- */
  var rail = document.getElementById("rail");
  var firstOfGen = {};
  DATA.forEach(function (p) {
    var g = p.data.gen;
    if (!firstOfGen[g]) firstOfGen[g] = p.id;
  });
  GENS.forEach(function (g) {
    var li = document.createElement("li");
    var hasLine = DATA.some(function (p) { return p.data.gen === g && p.data["name line"]; });
    if (hasLine) li.className = "line";
    li.dataset.gen = g;
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = g;
    b.title = "Generation " + g;
    b.addEventListener("click", function () { if (firstOfGen[g]) select(firstOfGen[g]); });
    li.appendChild(b);
    rail.appendChild(li);
  });
  function markRail(gen) {
    Array.prototype.forEach.call(rail.children, function (li) {
      li.classList.toggle("on", li.dataset.gen === gen);
    });
  }

  /* ---------- the record slip ---------- */
  function kinRow(title, ids) {
    if (!ids || !ids.length) return "";
    var btns = ids.filter(function (id) { return BY_ID[id]; }).map(function (id) {
      return '<button type="button" data-goto="' + id + '">' + esc(fullName(BY_ID[id])) + "</button>";
    }).join("");
    return btns ? "<h3>" + title + "</h3><div>" + btns + "</div>" : "";
  }

  function renderSlip(id) {
    var p = BY_ID[id];
    var d = p.data, r = p.rels || {};
    var idx = DATA.indexOf(p) + 1;
    document.getElementById("callno-left").textContent = "Gen " + d.gen;
    document.getElementById("callno-right").textContent =
      "I" + String(idx).padStart(4, "0");

    var h = ['<div class="slip">'];
    if (d.avatar) {
      h.push('<img src="' + esc(d.avatar) + '" alt="" onerror="this.remove()">');
    }
    if (d["name line"]) h.push('<span class="line-badge">Namenslinie Hotz</span>');
    h.push("<h2>" + esc(fullName(p)) + "</h2>");
    if (d["birth name"]) h.push('<p class="nee">geb. ' + esc(d["birth name"]) + "</p>");
    if (d.life) h.push('<p class="life">' + esc(d.life) + "</p>");

    h.push("<dl>");
    if (d.birth)    h.push("<dt>Geboren</dt><dd>" + esc(d.birth) + "</dd>");
    if (d.baptism)  h.push("<dt>Getauft</dt><dd>" + esc(d.baptism) + "</dd>");
    if (d.death)    h.push("<dt>Gestorben</dt><dd>" + esc(d.death) + "</dd>");
    if (d.burial)   h.push("<dt>Begraben</dt><dd>" + esc(d.burial) + "</dd>");
    if (d.origin)   h.push("<dt>Von</dt><dd>" + esc(d.origin) + "</dd>");
    if (d.remark)   h.push("<dt>Notiz</dt><dd>" + esc(d.remark) + "</dd>");
    h.push("</dl>");

    if (d.notes && d.notes.length) {
      h.push('<div class="marginalia">');
      d.notes.forEach(function (n) { h.push("<p>" + esc(n) + "</p>"); });
      h.push("</div>");
    }
    if (d.caveats && d.caveats.length) {
      h.push('<p class="caveat">Quellenvorbehalt: ' + esc(d.caveats.join(", ")) + "</p>");
    }

    var kin = kinRow("Eltern", r.parents) + kinRow("Partner", r.spouses) + kinRow("Kinder", r.children);
    if (kin) h.push('<div class="kin">' + kin + "</div>");
    h.push("</div>");

    var slip = document.getElementById("slip");
    slip.innerHTML = h.join("");
    slip.querySelectorAll("[data-goto]").forEach(function (b) {
      b.addEventListener("click", function () { select(b.dataset.goto); });
    });
    markRail(d.gen);
  }

  /* ---------- selection ---------- */
  function select(id) {
    if (!BY_ID[id]) return;
    current = id;
    renderSlip(id);
    try {
      if (chart && typeof chart.updateMainId === "function") {
        chart.updateMainId(id);
        chart.updateTree({});
      }
    } catch (e) { /* re-centring is a nice-to-have, the slip is the payload */ }
  }

  /* ---------- search ---------- */
  var q = document.getElementById("q"), results = document.getElementById("results");
  function closeResults() { results.style.display = "none"; results.innerHTML = ""; }
  q.addEventListener("input", function () {
    var term = q.value.trim().toLowerCase();
    if (term.length < 2) return closeResults();
    var hits = DATA.filter(function (p) {
      return (fullName(p) + " " + (p.data["birth name"] || "") + " " + (p.data.life || ""))
        .toLowerCase().indexOf(term) > -1;
    }).slice(0, 40);
    if (!hits.length) {
      results.innerHTML = '<button type="button" disabled>Kein Eintrag gefunden</button>';
    } else {
      results.innerHTML = hits.map(function (p) {
        return '<button type="button" data-goto="' + p.id + '">' + esc(fullName(p)) +
               '<span class="g">' + esc(p.data.gen) + (p.data.life ? " · " + esc(p.data.life) : "") +
               "</span></button>";
      }).join("");
      results.querySelectorAll("[data-goto]").forEach(function (b) {
        b.addEventListener("click", function () {
          select(b.dataset.goto); q.value = ""; closeResults();
        });
      });
    }
    results.style.display = "block";
  });
  q.addEventListener("keydown", function (e) { if (e.key === "Escape") closeResults(); });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search")) closeResults();
  });

  /* ---------- chart ---------- */
  function datumOf(el) {
    for (var n = el; n && n !== document.body; n = n.parentNode) {
      var d = n.__data__;
      if (d) {
        if (d.data && d.data.id && BY_ID[d.data.id]) return d.data.id;
        if (d.id && BY_ID[d.id]) return d.id;
        if (d.data && d.data.data && d.data.data.id) return d.data.data.id;
      }
    }
    return null;
  }

  function paintNameLine(container) {
    container.querySelectorAll("*").forEach(function (el) {
      var d = el.__data__;
      if (!d) return;
      var id = (d.data && d.data.id) || d.id;
      if (id && BY_ID[id] && BY_ID[id].data["name line"]) el.classList.add("is-line");
    });
  }

  function boot() {
    var container = document.getElementById("chart");
    if (!window.f3 || typeof window.f3.createChart !== "function") {
      document.getElementById("hint").innerHTML =
        "Die Bibliothek family-chart konnte nicht geladen werden.<br>" +
        "Mit Internetverbindung neu laden, oder family-chart lokal ablegen.";
      return;
    }
    document.getElementById("hint").remove();

    chart = f3.createChart("#chart", DATA);
    card = chart.setCardHtml();
    card.setCardDisplay([["first name", "last name"], ["life"]]);

    function tryCall(obj, name, args) {
      try { if (typeof obj[name] === "function") { obj[name].apply(obj, args); return true; } }
      catch (e) { console.warn(name + " nicht angewandt:", e.message); }
      return false;
    }

    tryCall(card, "setCardDim", [{ w: 240, h: 64, img_w: 52, img_h: 52 }]);
    tryCall(card, "setCardImageField", ["avatar"]);
    tryCall(card, "setMiniTree", [true]);
    tryCall(card, "setOnHoverPathToMain", []);
    tryCall(chart, "setTransitionTime", [reduced ? 0 : 700]);
    tryCall(chart, "setSingleParentEmptyCard", [false]);
    tryCall(chart, "setShowSiblingsOfMain", [true]);
    tryCall(chart, "setSortChildrenFunction", [function (a, b) {
      return birthYear(a) - birthYear(b);
    }]);

    // clicking a card: keep the library's re-centring, add our record slip
    var wired = tryCall(card, "setOnCardClick", [function (e, d) {
      try { card.onCardClickDefault(e, d); } catch (err) {}
      var id = d && d.data && d.data.id;
      if (id && BY_ID[id]) { current = id; renderSlip(id); }
    }]);
    if (!wired) {
      container.addEventListener("click", function (e) {
        var id = datumOf(e.target);
        if (id) { current = id; renderSlip(id); }
      });
    }

    applyDepth();

    try { if (typeof chart.updateMainId === "function") chart.updateMainId(START); } catch (e) {}
    chart.updateTree({ initial: true });

    container.addEventListener("click", function (e) {
      var id = datumOf(e.target);
      if (id) { current = id; renderSlip(id); }
    });

    var queued = false;
    var mo = new MutationObserver(function () {
      if (queued) return;
      queued = true;
      requestAnimationFrame(function () { queued = false; paintNameLine(container); });
    });
    mo.observe(container, { childList: true, subtree: true });
    paintNameLine(container);

    renderSlip(START);

    // refit when the window changes shape (rotating a phone, resizing a window)
    var rt = null;
    window.addEventListener("resize", function () {
      clearTimeout(rt);
      rt = setTimeout(function () {
        try { chart.updateTree({}); } catch (e) {}
      }, 250);
    });
  }

  boot();
}

/* --- password gate: AES-256-GCM, key from PBKDF2-SHA256 --- */
(function () {
  "use strict";
  var ENV = JSON.parse(document.getElementById("tree-data").textContent);
  var KEY = "hotz-stammbaum-pw";
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function unlock(pw) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(ENV.salt), iterations: ENV.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENV.iv) }, key, b64(ENV.ct));
      })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function open(pw, remember) {
    return unlock(pw).then(function (data) {
      if (remember) { try { localStorage.setItem(KEY, pw); } catch (e) {} }
      document.getElementById("gate").remove();
      startTree(data);
    });
  }
  var form = document.getElementById("gate-form");
  var err = document.getElementById("gate-err");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";
    open(document.getElementById("pw").value.trim().toLowerCase(), true)
      .catch(function () { err.textContent = "Falsches Passwort."; });
  });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) open(saved, false).catch(function () { try { localStorage.removeItem(KEY); } catch (e) {} });
})();
</script>
</body>
</html>
