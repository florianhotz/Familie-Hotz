<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familie Hotz · Stammbaum</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23FFFFFF'/%3E%3Cpath d='M8 15V4M8 8L3 3M8 8l5-5' stroke='%2324467F' stroke-width='1.4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000;
  --bg:#fff;
  --rule:#D6D6D6;
  --muted:#6B6B6B;
  --blue:#24467F;
  --mark:#7A5C2E;
  --m:#DCEBFA;      /* baby blue, men */
  --f:#FBE3EC;      /* baby pink, women */
  --font:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  display:grid;grid-template-rows:auto 1fr;overflow:hidden;
}
button,input{font-family:var(--font)}

/* ---------- masthead ---------- */
header{
  display:flex;align-items:baseline;gap:1.25rem;flex-wrap:wrap;
  padding:.7rem 1rem .6rem;border-bottom:1px solid var(--ink);background:var(--bg);
}
h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.sub{font-size:.72rem;color:var(--muted);font-style:italic}
.tools{display:flex;gap:.4rem;margin-left:auto}
.tools button{
  font-size:.68rem;letter-spacing:.06em;padding:.3rem .55rem;cursor:pointer;
  background:var(--bg);border:1px solid var(--rule);color:var(--ink);
}
.tools button:hover{border-color:var(--ink)}
.search{position:relative}
.search input{
  font-size:.78rem;padding:.35rem .5rem;width:min(15rem,42vw);
  background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:0;
}
.search input:focus,.tools button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.results{
  position:absolute;top:100%;right:0;z-index:40;width:min(22rem,80vw);
  max-height:60vh;overflow:auto;background:var(--bg);
  border:1px solid var(--ink);border-top:none;display:none;
}
.results button{
  display:block;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--rule);padding:.45rem .6rem;cursor:pointer;
  font-size:.8rem;color:var(--ink);
}
.results button:hover,.results button:focus{background:#F2F2F2;outline:none}
.results .g{font-size:.66rem;color:var(--muted);margin-left:.4rem}

/* ---------- body: tree + record slip ---------- */
main{display:grid;grid-template-columns:1fr minmax(15rem,21rem);min-height:0}
.chartwrap{position:relative;min-width:0;min-height:0}
#chart{position:absolute;inset:0;overflow:auto;background:var(--bg);touch-action:pan-x pan-y;cursor:grab}
#chart.drag{cursor:grabbing;user-select:none}
.zoombar{
  position:absolute;right:12px;bottom:12px;z-index:20;display:flex;flex-direction:column;
  background:var(--bg);border:1px solid var(--ink);
}
.zoombar button{
  width:2.4rem;height:2.4rem;border:none;border-bottom:1px solid var(--rule);background:var(--bg);
  color:var(--ink);font-size:1.15rem;cursor:pointer;padding:0;line-height:1;
}
.zoombar button:last-child{border-bottom:none}
.zoombar button.sm{font-size:.62rem}
.zoombar button:hover{background:#F2F2F2}
.zoombar output{display:block;text-align:center;font-size:.6rem;padding:.25rem 0;border-bottom:1px solid var(--rule)}
#canvas{display:flex;position:relative;width:max-content;min-width:100%}
.rail{
  position:sticky;left:0;z-index:5;flex:0 0 3.4rem;background:var(--bg);
  border-right:1px solid var(--ink);
}
.rail button{
  position:absolute;left:0;width:100%;border:none;background:none;cursor:pointer;
  font-size:.8rem;color:var(--muted);padding:0;
}
.rail button small{display:block;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase}
.rail button:hover{color:var(--ink)}
.rail button.on{color:var(--ink);font-weight:700}
#stage{position:relative;flex:0 0 auto}
#stage svg{position:absolute;left:0;top:0;pointer-events:none}
#stage svg path{fill:none;stroke:#9A9A9A;stroke-width:1.2}
.row-rule{position:absolute;left:0;right:0;border-top:1px solid #F0F0F0}

.card{
  position:absolute;display:flex;align-items:center;gap:.5rem;
  width:var(--cw);height:var(--ch);padding:.35rem .5rem;
  border:1px solid rgba(0,0,0,.28);color:var(--ink);cursor:pointer;text-align:left;
  font-size:.7rem;line-height:1.25;background:var(--m);
  transition:left .25s ease,top .25s ease,opacity .25s ease;
}
.card.F{background:var(--f)}
.card.line{box-shadow:inset 4px 0 0 var(--blue)}
.card.sel{outline:2px solid var(--ink);outline-offset:1px}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.card img,.card .ph{width:42px;height:42px;flex:0 0 42px;object-fit:cover;border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.6)}
.card .ph{display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.35);font-size:1rem}
.card .t{min-width:0;flex:1}
.card b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .t>span{display:block;font-size:.62rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .kids{
  position:absolute;left:50%;bottom:-.62rem;transform:translateX(-50%);
  font-size:.6rem;line-height:1;padding:.15rem .4rem;background:var(--bg);
  border:1px solid rgba(0,0,0,.35);white-space:nowrap;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

aside{border-left:1px solid var(--ink);background:var(--bg);overflow-y:auto;padding:0 0 2rem}
.callno{
  font-size:.62rem;letter-spacing:.1em;padding:.5rem .9rem;border-bottom:1px solid var(--ink);
  color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;gap:.5rem;
}
.callno .num{color:var(--ink);font-weight:600}
.slip{padding:.9rem .9rem 0}
.slip img{width:100%;max-width:9rem;border:1px solid var(--ink);display:block;margin:0 0 .8rem}
.slip h2{margin:0 0 .15rem;font-size:1.05rem;font-weight:600;line-height:1.25}
.slip .nee{font-size:.75rem;color:var(--muted);font-style:italic;margin:0 0 .7rem}
.slip .life{font-size:.75rem;margin:0 0 .9rem}
.slip .line-badge{
  display:inline-block;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
  color:#fff;background:var(--blue);padding:.15rem .4rem;margin:0 0 .8rem;
}
dl{margin:0 0 .9rem;font-size:.78rem}
dt{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.55rem}
dd{margin:.1rem 0 0}
.marginalia{border-top:1px solid var(--rule);margin-top:.9rem;padding-top:.6rem;font-size:.74rem;line-height:1.5}
.marginalia p{margin:0 0 .55rem;padding-left:1rem;position:relative;font-style:italic}
.marginalia p::before{content:"§";position:absolute;left:0;top:0;font-style:normal;font-size:.7rem;color:var(--mark)}
.caveat{font-size:.64rem;color:var(--mark);border:1px dashed var(--mark);padding:.3rem .45rem;margin:.2rem 0 0}
.kin{border-top:1px solid var(--rule);margin-top:.9rem;padding-top:.6rem}
.kin h3{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:.5rem 0 .3rem;font-weight:500}
.kin button{
  font-size:.76rem;background:none;cursor:pointer;border:none;border-bottom:1px solid var(--rule);
  color:var(--ink);padding:.15rem 0;margin:0 .7rem .2rem 0;text-align:left;
}
.kin button:hover,.kin button:focus{border-bottom-color:var(--blue);color:var(--blue);outline:none}
.empty{padding:1.2rem .9rem;font-size:.8rem;color:var(--muted);font-style:italic}

@media (max-width:820px){
  body{overflow:auto}
  main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  .zoombar button{width:2.6rem;height:2.6rem}
  aside{border-left:none;border-top:1px solid var(--ink)}
  header{padding:.55rem .7rem .5rem;gap:.5rem}
  .sub{font-size:.66rem;flex-basis:100%}
  .tools{margin-left:0}
  .search{margin-left:auto}
  .search input{width:min(9rem,38vw)}
}

/* ---------- editing ---------- */
.edit-row{display:flex;gap:.4rem;flex-wrap:wrap;margin:.2rem 0 .9rem}
.btn{
  font-size:.68rem;letter-spacing:.04em;padding:.4rem .6rem;cursor:pointer;
  background:var(--bg);border:1px solid var(--ink);color:var(--ink);
}
.btn:hover{background:#F2F2F2}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#333}
.btn:disabled{opacity:.45;cursor:default}
.obit{border-top:1px solid var(--rule);margin-top:.9rem;padding-top:.6rem;font-size:.76rem;line-height:1.55}
.obit h3,.hist summary{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:.3rem 0 .4rem;font-weight:500}
.obit div{white-space:pre-wrap}
.edited{font-size:.62rem;color:var(--muted);margin:.6rem 0 0}
.hist{border-top:1px solid var(--rule);margin-top:.9rem;padding-top:.4rem;font-size:.7rem}
.hist summary{cursor:pointer}
.hist li{margin:.35rem 0;list-style:none}
.hist ul{padding:0;margin:.3rem 0}
.hist button{font-size:.62rem;margin-left:.4rem;background:none;border:none;border-bottom:1px solid var(--rule);cursor:pointer;padding:0}
#dlg{border:1px solid var(--ink);padding:0;width:min(30rem,94vw);max-height:92vh;color:var(--ink);background:var(--bg)}
#dlg::backdrop{background:rgba(0,0,0,.35)}
#dlg form{padding:1rem;display:grid;gap:.7rem}
#dlg h2{margin:0;font-size:.9rem;letter-spacing:.06em}
#dlg label{display:grid;gap:.2rem;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#dlg input,#dlg textarea,#dlg select{
  font-family:var(--font);font-size:.85rem;padding:.45rem;border:1px solid var(--rule);
  color:var(--ink);background:#fff;text-transform:none;letter-spacing:0;width:100%;
}
#dlg textarea{min-height:5rem;resize:vertical}
#dlg textarea.big{min-height:9rem}
#dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
#dlg .actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
#dlg .msg{font-size:.7rem;min-height:1em;margin:0}
#dlg .msg.err{color:#9B2C2C}
#dlg .hint2{font-size:.66rem;color:var(--muted);margin:0;text-transform:none;letter-spacing:0}
.crop{display:grid;gap:.5rem;justify-items:center}
.crop canvas{width:260px;height:260px;border:1px solid var(--ink);touch-action:none;cursor:grab;background:#F4F4F4}
.crop input[type=range]{width:260px}
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:2000;
  background:var(--ink);color:#fff;font-size:.75rem;padding:.55rem .9rem;display:none;
}

/* --- password gate --- */
#gate{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#gate form{background:var(--bg);border:1px solid var(--rule);padding:28px 24px;width:100%;max-width:340px;display:grid;gap:12px}
#gate h2{margin:0;font-weight:700;font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase}
#gate p{margin:0;font-size:.75rem;color:var(--muted)}
#gate input{font-size:1rem;padding:10px;border:1px solid var(--rule);background:#fff;color:var(--ink)}
#gate button{font-size:.85rem;padding:10px;border:0;background:var(--ink);color:#fff;cursor:pointer}
#gate .err{color:#9B2C2C;min-height:1em}
</style>
</head>
<body>
<div id="gate">
  <form id="gate-form" autocomplete="off">
    <h2>Hotz</h2>
    <p>Familienstammbaum · Passwort erforderlich</p>
    <label for="pw" hidden>Passwort</label>
    <input id="pw" type="password" placeholder="Passwort" autofocus>
    <button type="submit">Öffnen</button>
    <p class="err" id="gate-err" aria-live="polite"></p>
  </form>
</div>

<header>
  <h1>Hotz</h1>
  <span class="sub">Vierzehn Generationen · ca. 1580–2024 · Wipkingen bis Winterthur</span>
  <div class="tools">
    <button type="button" id="open-all">Alle aufklappen</button>
    <button type="button" id="close-all">Zuklappen</button>
  </div>
  <div class="search">
    <label for="q" hidden>Person suchen</label>
    <input id="q" type="search" placeholder="Person suchen…" autocomplete="off" spellcheck="false">
    <div class="results" id="results" role="listbox"></div>
  </div>
</header>

<main>
  <div class="chartwrap">
    <div id="chart">
      <div id="canvas">
        <nav class="rail" id="rail" aria-label="Generationen"></nav>
        <div id="stage"></div>
      </div>
    </div>
    <div class="zoombar" role="group" aria-label="Zoom">
      <button type="button" id="zin" aria-label="Vergrössern">+</button>
      <output id="zval">100%</output>
      <button type="button" id="zout" aria-label="Verkleinern">−</button>
      <button type="button" id="zfit" class="sm" aria-label="Alles einpassen" title="Alles einpassen">FIT</button>
    </div>
  </div>
  <aside aria-live="polite">
    <div class="callno"><span id="callno-left">Karteikarte</span><span class="num" id="callno-right">—</span></div>
    <div id="slip"><p class="empty">Eine Person im Baum antippen.</p></div>
  </aside>
</main>

<dialog id="dlg"></dialog>

<script>
function startTree(DATA, CFG) {
  "use strict";
  var BY_ID = {};
  DATA.forEach(function (p) { BY_ID[p.id] = p; });

  var ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV"];
  function genNo(p) { return p.data.gn || (ROMAN.indexOf(p.data.gen) + 1); }
  var NGEN = 0;
  function calcNGEN() { NGEN = 0; DATA.forEach(function (p) { NGEN = Math.max(NGEN, genNo(p)); }); }
  calcNGEN();

  var START = BY_ID["florian_hotz_1984"] ? "florian_hotz_1984" : DATA[0].id;
  var CW = 196, CH = 58, SG = 30, HG = 26, ROW = 118, PADX = 24, PADY = 28;
  var stage = document.getElementById("stage"), chartEl = document.getElementById("chart");
  var railEl = document.getElementById("rail");
  stage.style.setProperty("--cw", CW + "px");
  stage.style.setProperty("--ch", CH + "px");

  /* ---------- blood line vs. married-in ---------- */
  var ROOT = DATA.filter(function (p) { return !(p.rels.parents || []).length &&
    !(p.rels.spouses || []).some(function (s) { return (BY_ID[s].rels.parents || []).length; }) &&
    (p.rels.children || []).length; })[0].id;
  var BLOOD = {};
  function recomputeBlood() {
    BLOOD = {};
    (function walk(id) {
      if (BLOOD[id]) return;
      BLOOD[id] = true;
      (BY_ID[id].rels.children || []).forEach(function (c) { if (BY_ID[c]) walk(c); });
    })(ROOT);
  }
  recomputeBlood();
  function anchor(id) {               // the blood-line person a card belongs to
    if (BLOOD[id]) return id;
    var s = (BY_ID[id].rels.spouses || []).filter(function (x) { return BLOOD[x]; })[0];
    return s || id;
  }
  function birthYear(id) {
    var d = BY_ID[id].data, m = String(d.birth || d.baptism || d.death || "").match(/(\d{4})/);
    return m ? +m[1] : 9999;
  }
  function kids(id) {
    return (BY_ID[id].rels.children || []).filter(function (c) { return BY_ID[c]; })
      .slice().sort(function (a, b) { return birthYear(a) - birthYear(b); });
  }
  function otherParent(child, id) {
    return (BY_ID[child].rels.parents || []).filter(function (q) { return q !== id && BY_ID[q]; })[0] || null;
  }
  // every partner: listed spouses plus the other parent of any child
  function partnersOf(id) {
    var out = [];
    (BY_ID[id].rels.spouses || []).forEach(function (s) { if (BY_ID[s] && out.indexOf(s) < 0) out.push(s); });
    kids(id).forEach(function (c) { var o = otherParent(c, id); if (o && out.indexOf(o) < 0) out.push(o); });
    return out;
  }
  // order in the row: 1st partner right, 2nd left, 3rd further right, …
  function slots(id) {
    var right = [], left = [];
    partnersOf(id).forEach(function (s, i) { (i % 2 === 0 ? right : left).push(s); });
    return left.slice().reverse().concat([id]).concat(right);
  }

  /* ---------- open/closed state ---------- */
  var open = {};
  function openPathTo(id) {
    var a = anchor(id);
    for (var cur = a; cur; ) {
      var par = (BY_ID[cur].rels.parents || []).filter(function (x) { return BLOOD[x]; })[0];
      if (!par) break;
      open[par] = true; cur = par;
    }
  }

  function fullName(p) { var d = p.data; return (d["first name"] || "") + (d["last name"] ? " " + d["last name"] : ""); }
  function cardName(p) {                    // in the tree: the name someone was born with
    var d = p.data, ln = d["birth name"] && d["birth name"] !== d["last name"] ? d["birth name"] : d["last name"];
    return (d["first name"] || "") + (ln ? " " + ln : "");
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ---------- layout: a blood-line person and all partners form one unit ---------- */
  function unitW(id) { var n = slots(id).length; return n * CW + (n - 1) * SG; }
  function measure(id) {
    var w = unitW(id);
    if (!open[id]) return w;
    var ks = kids(id); if (!ks.length) return w;
    var sum = ks.reduce(function (s, k) { return s + measure(k); }, 0) + HG * (ks.length - 1);
    return Math.max(w, sum);
  }
  var POS, LINKS, WIDTH;
  function place(id, x0) {
    var w = measure(id), sl = slots(id), uw = unitW(id), y = PADY + (genNo(BY_ID[id]) - 1) * ROW;
    var ux = x0 + (w - uw) / 2, ip = sl.indexOf(id), drop = {};
    sl.forEach(function (s, j) { POS[s] = { x: ux + j * (CW + SG), y: y }; });
    var px = POS[id].x;
    sl.forEach(function (s, j) {               // couple line, children hang from its partner-side gap
      if (s === id) return;
      var sx = POS[s].x;
      if (j > ip) { LINKS.push([px + CW, y + CH / 2, sx, y + CH / 2, "h"]); drop[s] = [sx - SG / 2, y + CH / 2]; }
      else        { LINKS.push([sx + CW, y + CH / 2, px, y + CH / 2, "h"]); drop[s] = [sx + CW + SG / 2, y + CH / 2]; }
    });
    WIDTH = Math.max(WIDTH, x0 + w);
    if (open[id]) {
      var all = kids(id), ks = [];
      sl.forEach(function (s) {                // children grouped by couple, left to right
        all.forEach(function (k) {
          var o = otherParent(k, id);
          if (s === id ? !o || sl.indexOf(o) < 0 : o === s) ks.push(k);
        });
      });
      var sum = ks.reduce(function (s, k) { return s + measure(k); }, 0) + HG * (ks.length - 1);
      var cx = x0 + (w - sum) / 2;
      ks.forEach(function (k) {
        var kw = measure(k); place(k, cx);
        var o = otherParent(k, id), d = (o && drop[o]) || [px + CW / 2, y + CH];
        LINKS.push([d[0], d[1], POS[k].x + CW / 2, POS[k].y]);
        cx += kw + HG;
      });
    }
  }

  /* ---------- rendering ---------- */
  var cards = {}, selected = null;
  function makeCard(id) {
    var p = BY_ID[id], d = p.data, b = document.createElement("button");
    b.type = "button";
    b.className = "card " + (d.gender === "F" ? "F" : "M") + (d["name line"] ? " line" : "");
    b.dataset.id = id;
    b.innerHTML = (d.avatar ? '<img src="' + esc(d.avatar) + '" alt="">' : '<span class="ph">' + (d.gender === "F" ? "♀" : "♂") + "</span>") +
      '<span class="t"><b>' + esc(cardName(p)) + "</b><span>" + esc(d.life || "") + "</span></span>";
    b.addEventListener("click", function () { toggle(id); });
    stage.appendChild(b);
    return b;
  }

  function render() {
    POS = {}; LINKS = []; WIDTH = 0;
    place(ROOT, PADX);
    var H = PADY * 2 + NGEN * ROW - (ROW - CH);
    stage.style.width = (WIDTH + PADX) + "px";
    stage.style.height = H + "px";
    railEl.style.height = H + "px";

    var svg = '<svg width="' + (WIDTH + PADX) + '" height="' + H + '">';
    LINKS.forEach(function (l) {
      if (l[4] === "h") { svg += '<path d="M' + l[0] + " " + l[1] + "H" + l[2] + '"/>'; return; }
      var mid = (PADY + Math.round((l[1] - PADY) / ROW) * ROW + CH) + (ROW - CH) / 2;
      svg += '<path d="M' + l[0] + " " + l[1] + "V" + mid + "H" + l[2] + "V" + l[3] + '"/>';
    });
    svg += "</svg>";
    var old = stage.querySelector("svg");
    if (old) old.outerHTML = svg; else stage.insertAdjacentHTML("afterbegin", svg);

    Object.keys(cards).forEach(function (id) {
      if (!POS[id]) { cards[id].remove(); delete cards[id]; }
    });
    Object.keys(POS).forEach(function (id) {
      var c = cards[id] || (cards[id] = makeCard(id));
      c.style.left = POS[id].x + "px"; c.style.top = POS[id].y + "px";
      var a = anchor(id), n = kids(a).length, badge = c.querySelector(".kids");
      if (BLOOD[id] && n) {
        if (!badge) { badge = document.createElement("span"); badge.className = "kids"; c.appendChild(badge); }
        badge.textContent = open[a] ? "▴ zuklappen" : "▾ " + n + (n === 1 ? " Kind" : " Kinder");
      } else if (badge) badge.remove();
      c.classList.toggle("sel", id === selected);
      c.setAttribute("aria-expanded", n ? String(!!open[a]) : "false");
    });
  }

  /* ---------- generation rail, aligned with the rows ---------- */
  var railBtns = [], railN = 0;
  function buildRail() {
    if (railN === NGEN) return;
    railN = NGEN; railBtns = []; railEl.querySelectorAll("button").forEach(function (b) { b.remove(); });
    for (var g = 1; g <= NGEN; g++) addRailBtn(g);
  }
  function addRailBtn(g) {
    var b = document.createElement("button");
    b.type = "button";
    b.style.top = (PADY + (g - 1) * ROW) + "px";
    b.style.height = CH + "px";
    b.innerHTML = "<small>Gen</small>" + g;
    b.title = "Generation " + g;
    b.addEventListener("click", function () {
      chartEl.scrollTo({ top: Math.max(0, (PADY + (g - 1) * ROW) * Z - 40), behavior: "smooth" });
    });
    railEl.appendChild(b); railBtns.push(b);
  }
  buildRail();
  function markRail(gn) { railBtns.forEach(function (b, i) { b.classList.toggle("on", i + 1 === gn); }); }

  /* ---------- the record slip ---------- */
  function kinRow(title, ids) {
    if (!ids || !ids.length) return "";
    var btns = ids.filter(function (id) { return BY_ID[id]; }).map(function (id) {
      return '<button type="button" data-goto="' + id + '">' + esc(fullName(BY_ID[id])) + "</button>";
    }).join("");
    return btns ? "<h3>" + title + "</h3><div>" + btns + "</div>" : "";
  }
  function renderSlip(id) {
    var p = BY_ID[id], d = p.data, r = p.rels || {};
    document.getElementById("callno-left").textContent = "Generation " + genNo(p);
    document.getElementById("callno-right").textContent = "I" + String(DATA.indexOf(p) + 1).padStart(4, "0");
    var h = ['<div class="slip">'];
    if (d.avatar) h.push('<img src="' + esc(d.avatar) + '" alt="">');
    if (d["name line"]) h.push('<span class="line-badge">Namenslinie Hotz</span>');
    h.push("<h2>" + esc(fullName(p)) + "</h2>");
    if (d["birth name"]) h.push('<p class="nee">geb. ' + esc(d["birth name"]) + "</p>");
    if (d.life) h.push('<p class="life">' + esc(d.life) + "</p>");

      '<input type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom">' +
      '<p class="hint2">Foto wählen, dann ziehen und zoomen, bis das Gesicht gut sitzt.</p>' +
      '<div class="actions"><label class="btn" style="display:inline-block;text-transform:none;letter-spacing:.04em;color:var(--ink);font-size:.68rem">Foto wählen…' +
      '<input type="file" accept="image/*" hidden></label>' +
      (p.data.avatar ? '<button type="button" class="btn" data-rm>Foto entfernen</button>' : "") + "</div></div>";
    var removing = false;
    var form = showDialog(html, function (form) {
      var snap = JSON.parse(JSON.stringify(s)); snap.__author = form.__author.value;
      if (removing) { snap.photo = null; return saveSnap(id, snap); }
      if (!img) return { local: "Bitte zuerst ein Foto wählen." };
      var out = document.createElement("canvas"); out.width = out.height = 320;
      draw(out.getContext("2d"), 320);
      var photo = { id: newPhotoId(), dataUrl: out.toDataURL("image/jpeg", 0.85) };
      snap.photo = photo.id;
      return saveSnap(id, snap, photo);
    });
    var cv = form.querySelector("canvas"), ctx = cv.getContext("2d"), range = form.querySelector("input[type=range]");
    function draw(c, size) {
      c.fillStyle = "#fff"; c.fillRect(0, 0, size, size);
      if (!img) return;
      var k = size / 520, w = img.width * base * sc * k, h = img.height * base * sc * k;
      c.drawImage(img, size / 2 - w / 2 + ox * k, size / 2 - h / 2 + oy * k, w, h);
    }
    function clamp() {
      var w = img.width * base * sc, h = img.height * base * sc;
      ox = Math.max(-(w - 520) / 2, Math.min((w - 520) / 2, ox));
      oy = Math.max(-(h - 520) / 2, Math.min((h - 520) / 2, oy));
    }
    function redraw() { if (img) clamp(); draw(ctx, 520); }
    if (p.data.avatar) {                       // start from the current photo
      var cur = new Image();
      cur.onload = function () { if (!img) { ctx.drawImage(cur, 0, 0, 520, 520); } };
      cur.src = p.data.avatar;
    }
    form.querySelector("input[type=file]").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var im = new Image();
        im.onload = function () {
          img = im; base = Math.max(520 / im.width, 520 / im.height); sc = 1; ox = oy = 0;
          range.value = 1; removing = false; redraw();
        };
        im.onerror = function () { dlg.querySelector("#dlg-msg").textContent = "Dieses Bildformat kann der Browser nicht öffnen (bitte JPEG oder PNG)."; };
        im.src = r.result;
      };
      r.readAsDataURL(f);
    });
    range.addEventListener("input", function () { sc = +range.value; redraw(); });
    var drag = null;
    cv.addEventListener("pointerdown", function (e) { if (!img) return; drag = { x: e.clientX, y: e.clientY, ox: ox, oy: oy }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var k = 520 / cv.getBoundingClientRect().width;
      ox = drag.ox + (e.clientX - drag.x) * k; oy = drag.oy + (e.clientY - drag.y) * k; redraw();
    });
    cv.addEventListener("pointerup", function () { drag = null; });
    var rm = form.querySelector("[data-rm]");
    if (rm) rm.addEventListener("click", function () {
      removing = true; img = null; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 520, 520);
      dlg.querySelector("#dlg-msg").textContent = "Foto wird beim Speichern entfernt.";
    });
  }

  /* ---------- zoom: buttons, mouse wheel, trackpad / touch pinch, drag to pan ---------- */
  var canvas = document.getElementById("canvas"), zval = document.getElementById("zval");
  var RAILW = 3.4 * 16, ZMIN = 0.2, ZMAX = 2, Z = window.innerWidth < 820 ? 0.75 : 1;
  function setZoom(z, cx, cy) {             // (cx, cy): point in the chart viewport that stays put
    z = Math.max(ZMIN, Math.min(ZMAX, z));
    if (cx == null) { cx = chartEl.clientWidth / 2; cy = chartEl.clientHeight / 2; }
    var px = (chartEl.scrollLeft + cx) / Z, py = (chartEl.scrollTop + cy) / Z;
    Z = z;
    canvas.style.zoom = Z;
    chartEl.scrollLeft = px * Z - cx;
    chartEl.scrollTop = py * Z - cy;
    zval.textContent = Math.round(Z * 100) + "%";
  }
  canvas.style.zoom = Z; zval.textContent = Math.round(Z * 100) + "%";
  document.getElementById("zin").addEventListener("click", function () { setZoom(Z * 1.25); });
  document.getElementById("zout").addEventListener("click", function () { setZoom(Z / 1.25); });
  document.getElementById("zfit").addEventListener("click", function () {
    var w = RAILW + parseFloat(stage.style.width), h = parseFloat(stage.style.height);
    setZoom(Math.min(chartEl.clientWidth / w, chartEl.clientHeight / h) * 0.98, 0, 0);
    chartEl.scrollTo(0, 0);
  });

  function localXY(e) {
    var r = chartEl.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  chartEl.addEventListener("wheel", function (e) {
    // pinch on a trackpad arrives as ctrl+wheel; a real mouse wheel moves in coarse
    // integer steps. Two-finger trackpad scrolling is left alone so it still pans.
    var mouse = e.deltaMode === 1 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 50 && e.deltaY % 1 === 0 &&
                (e.wheelDeltaY === undefined || Math.abs(e.wheelDeltaY) % 120 === 0));
    if (!e.ctrlKey && !mouse) return;
    e.preventDefault();
    var xy = localXY(e), step = e.ctrlKey ? Math.exp(-e.deltaY * 0.01) : (e.deltaY < 0 ? 1.15 : 1 / 1.15);
    setZoom(Z * step, xy[0], xy[1]);
  }, { passive: false });

  var pinch = null;
  function tdist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  function tmid(t) {
    var r = chartEl.getBoundingClientRect();
    return [(t[0].clientX + t[1].clientX) / 2 - r.left, (t[0].clientY + t[1].clientY) / 2 - r.top];
  }
  chartEl.addEventListener("touchstart", function (e) {
    if (e.touches.length === 2) pinch = { d: tdist(e.touches), z: Z, m: tmid(e.touches) };
  }, { passive: true });
  chartEl.addEventListener("touchmove", function (e) {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    var m = tmid(e.touches);
    chartEl.scrollLeft -= m[0] - pinch.m[0]; chartEl.scrollTop -= m[1] - pinch.m[1];
    pinch.m = m;
    setZoom(pinch.z * tdist(e.touches) / pinch.d, m[0], m[1]);
  }, { passive: false });
  chartEl.addEventListener("touchend", function (e) { if (e.touches.length < 2) pinch = null; });
  // Safari's own pinch gesture events
  var gz = null;
  chartEl.addEventListener("gesturestart", function (e) { e.preventDefault(); gz = Z; });
  chartEl.addEventListener("gesturechange", function (e) {
    e.preventDefault(); var xy = localXY(e); setZoom(gz * e.scale, xy[0], xy[1]);
  });

  var drag = null, dragged = false;
  chartEl.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, sl: chartEl.scrollLeft, st: chartEl.scrollTop }; dragged = false;
  });
  window.addEventListener("mousemove", function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!dragged && Math.abs(dx) + Math.abs(dy) < 5) return;
    dragged = true; chartEl.classList.add("drag");
    chartEl.scrollLeft = drag.sl - dx; chartEl.scrollTop = drag.st - dy;
  });
  window.addEventListener("mouseup", function () { drag = null; chartEl.classList.remove("drag"); });
  chartEl.addEventListener("click", function (e) {      // a drag that ends on a card is not a click
    if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; }
  }, true);

  /* ---------- interaction ---------- */
  function keepInPlace(id, fn) {           // re-layout without the clicked card jumping
    var before = POS[id] ? { x: POS[id].x, y: POS[id].y } : null;
    fn();
    if (before && POS[id]) {
      chartEl.scrollLeft += (POS[id].x - before.x) * Z;
      chartEl.scrollTop += (POS[id].y - before.y) * Z;
    }
  }
  function toggle(id) {
    selected = id; renderSlip(id);
    var a = anchor(id);
    keepInPlace(id, function () {
      if (kids(a).length) open[a] = !open[a];
      render();
    });
  }
  function scrollToCard(id, smooth) {
    var p = POS[id]; if (!p) return;
    chartEl.scrollTo({
      left: Math.max(0, (RAILW + p.x + CW / 2) * Z - (chartEl.clientWidth + RAILW * Z) / 2),
      top: Math.max(0, (p.y + CH / 2) * Z - chartEl.clientHeight / 2),
      behavior: smooth ? "smooth" : "auto"
    });
  }
  function goTo(id) {
    if (!BY_ID[id]) return;
    openPathTo(id);
    selected = id; renderSlip(id); render(); scrollToCard(id, true);
  }

  document.getElementById("open-all").addEventListener("click", function () {
    Object.keys(BLOOD).forEach(function (id) { if (kids(id).length) open[id] = true; });
    keepInPlace(selected, render);
  });
  document.getElementById("close-all").addEventListener("click", function () {
    open = {}; openPathTo(selected || START); render(); scrollToCard(selected || START, false);
  });

  /* ---------- search ---------- */
  var q = document.getElementById("q"), results = document.getElementById("results");
  function closeResults() { results.style.display = "none"; results.innerHTML = ""; }
  q.addEventListener("input", function () {
    var term = q.value.trim().toLowerCase();
    if (term.length < 2) return closeResults();
    var hits = DATA.filter(function (p) {
      return (fullName(p) + " " + (p.data["birth name"] || "") + " " + (p.data.life || "")).toLowerCase().indexOf(term) > -1;
    }).slice(0, 40);
    results.innerHTML = hits.length ? hits.map(function (p) {
      return '<button type="button" data-goto="' + p.id + '">' + esc(fullName(p)) +
        '<span class="g">Gen ' + genNo(p) + (p.data.life ? " · " + esc(p.data.life) : "") + "</span></button>";
    }).join("") : '<button type="button" disabled>Kein Eintrag gefunden</button>';
    results.querySelectorAll("[data-goto]").forEach(function (b) {
      b.addEventListener("click", function () { goTo(b.dataset.goto); q.value = ""; closeResults(); });
    });
    results.style.display = "block";
  });
  q.addEventListener("keydown", function (e) { if (e.key === "Escape") closeResults(); });
  document.addEventListener("click", function (e) { if (!e.target.closest(".search")) closeResults(); });

  /* ---------- start: the line down to Florian, his children shown ---------- */
  openPathTo(START);
  if (kids(START).length) open[START] = true;
  selected = START;
  render(); renderSlip(START); scrollToCard(START, false);
  loadEdits();
}

/* --- password gate: AES-256-GCM, key from PBKDF2-SHA256 --- */
(function () {
  "use strict";
  var ENV = JSON.parse(document.getElementById("tree-data").textContent);
  var KEY = "hotz-stammbaum-pw";
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function unlock(pw) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(ENV.salt), iterations: ENV.iter, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENV.iv) }, key, b64(ENV.ct));
      })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function open(pw, remember) {
    return unlock(pw).then(function (data) {
      if (remember) { try { localStorage.setItem(KEY, pw); } catch (e) {} }
      document.getElementById("gate").remove();
      if (Array.isArray(data)) startTree(data, null);
      else startTree(data.people, data.cfg || null);
    });
  }
  var form = document.getElementById("gate-form");
  var err = document.getElementById("gate-err");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";
    open(document.getElementById("pw").value.trim().toLowerCase(), true)
      .catch(function () { err.textContent = "Falsches Passwort."; });
  });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) open(saved, false).catch(function () { try { localStorage.removeItem(KEY); } catch (e) {} });
})();
</script>
